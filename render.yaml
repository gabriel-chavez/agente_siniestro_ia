# Atajo opcional: Render → New → Blueprint lee este archivo y crea los servicios.
# Si prefieres hacerlo a mano (New → Web Service), sigue el README, sección 4.
services:
  # El bot de Telegram
  - type: web
    name: agente-siniestro-ia
    runtime: python
    plan: free
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync bot.py
    envVars:
      - key: GEMINI_API_KEY_LOCAL
        sync: false # Render te la pide al crear el servicio; no va en el código
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_PERMITIDOS
        sync: false

  # La demo web pública (opcional)
  - type: web
    name: agente-siniestro-web
    runtime: python
    plan: free
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY_LOCAL
        sync: false
